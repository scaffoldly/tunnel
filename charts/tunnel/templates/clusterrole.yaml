{{- /*
Every rule here traces to a call site. An unused grant is a standing offer to
whoever gets hold of this ServiceAccount, so nothing speculative goes in — new
capability brings its rules in the same commit as the code that calls them.

  ingresses (get/list/watch      informer LIST/WATCH plus Reconcile's Get. The
    +create/update/delete)       write verbs are the Service half: a Service
                                 that asks for a tunnel gets a child Ingress
                                 created for it, updated when the Service's
                                 port or provider changes, and deleted when the
                                 trigger is removed.

                                 delete is the verb to be deliberate about, and
                                 it is granted cluster-wide because RBAC cannot
                                 express "only objects you created". The scoping
                                 is metav1.IsControlledBy in prune(), which
                                 compares the controller reference's UID: an
                                 Ingress this controller did not create is never
                                 a candidate, whatever its name. Owner-reference
                                 GC covers the Service being deleted; this verb
                                 covers the annotation being removed while the
                                 Service stays, which is the ordinary case and
                                 the one nothing else notices.

  services (get/list/watch)      The Service half watches every Service in the
                                 cluster — there is no field selector for "has
                                 an annotation whose name half is tunnel" — and
                                 reads the matching ones in full. The watch is
                                 metadata-only, but RBAC does not distinguish:
                                 the metadata endpoint is the same resource.

  services/status (patch)        Only the spec.loadBalancerClass path, and only
                                 to write a hostname the tunnel actually serves.
                                 Note what is absent: no write verb on services
                                 itself, so this controller cannot touch a
                                 Service's spec or metadata even by mistake.
                                 An annotated Service is left exactly as its
                                 author wrote it, and that boundary lives here
                                 rather than only in the code that respects it.

                                 patch, not update: publish() sends a merge
                                 patch computed against the object it read.

  ingresses/status (update)      Reconcile's publish() writes the hostname to
                                 status.loadBalancer.ingress[].hostname and
                                 clears it when the tunnel fails. Status().Update
                                 is a PUT on the subresource, hence update alone.
                                 No "update" on ingresses itself: teardown needs
                                 no finalizer, because the tunnel lives in the
                                 controller process, not in the cluster.

  namespaces (get)               Config.Owner reads the controller's own
                                 namespace to build the ownerReference on the
                                 classes the install flags create, so uninstalling
                                 collects them. Cluster-scoped dependents can
                                 only have cluster-scoped owners, which rules
                                 out the Deployment.

                                 The Ingress and Gateway halves also read
                                 Services here, through the manager's *uncached*
                                 API reader: (*Reconciler).port resolves a named
                                 port and confirms it is exposed.

  ingressclasses (+create)       Resolve spec.ingressClassName back to a
                                 controller, and to the provider the class is
                                 named for; create for --install-ingress-classes.
                                 An existing class naming someone else is read
                                 and left alone, so no update.

  gateways, gatewayclasses       Same shape. Inert on clusters without the
                                 Gateway API CRDs: the controllers do not
                                 register there, and a rule naming an absent
                                 group is not an error.

  httproutes (get/list/watch)    A Gateway names no backend; routes attach to
                                 it, so the origin comes from whichever
                                 HTTPRoutes accept it as a parent.

  gateways/status (update)       publish() writes the tunnel hostname to
                                 status.addresses, the Gateway API's equivalent
                                 of the Ingress status.loadBalancer.

  gatewayclasses/status (update) Gateway API requires the implementing controller
                                 to publish Accepted, so the class reports
                                 Accepted=True with the generation it observed.
                                 A conformant consumer may refuse a class its
                                 controller has not accepted. SupportedVersion
                                 rides along, which the spec requires whenever a
                                 class is accepted.

  events.k8s.io/events           mgr.GetEventRecorder is the events.k8s.io/v1
                                 client: it creates an event and patches it as
                                 the series repeats, and never touches the core
                                 "" events resource — so that group is
                                 deliberately absent. kubectl describe still
                                 shows these; the API server serves one store
                                 through both endpoints.

  customresourcedefinitions      --install-gateway-api bundles the CRDs and
    (get/list/watch/create/update) installs them where a cluster has none, so a
                                 Gateway-API-less cluster is usable without a
                                 second install step. get to compare, create to
                                 add, update only to upgrade an older bundle of
                                 the same channel.

                                 No delete, and that is load-bearing rather than
                                 minimalism: upstream's rules for bundling say
                                 never remove Gateway API CRDs, because several
                                 implementations share one set and deleting them
                                 destroys every Gateway object in the cluster.
                                 Withholding the verb means a bug cannot do it.

                                 list is also read with --install-gateway-api
                                 off: the GatewayClass SupportedVersion
                                 condition is the bundle-version annotation on
                                 whatever CRDs the cluster serves, whoever
                                 installed them. Dropping this rule alongside
                                 the flag would leave the class unable to say
                                 what it supports.

Deliberately absent:

  coordination.k8s.io/leases     --leader-elect defaults to false and the
                                 Deployment passes no args, so the manager never
                                 takes a lease. This must come back before
                                 replicas > 1 — two replicas both minting tunnels
                                 for one Ingress leak a tunnel per reconcile.
                                 Leader election emits its lock events through
                                 the older core client, so it needs
                                 ["" / events: create, patch] alongside it.

  secrets                        The one to watch. Persisting a minted tunnel
                                 spec so a restart keeps its hostname would need
                                 a namespaced Role over them, landing with that
                                 code.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tunnel.fullname" . }}
  labels:
    {{- include "tunnel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways/status"]
    verbs: ["update"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status"]
    verbs: ["update"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update"]
