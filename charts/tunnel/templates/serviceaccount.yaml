{{- /*
Carries the header when namespace.create is off, since it is then the first
object rendered. The Namespace template carries it otherwise.

The served manifest renders into tunnel-system and ships that Namespace, so
`kubectl apply -f https://tunnel.pizza` is self-contained. kube-system was tried
and reverted: rendering a Namespace object for it makes kubectl patch a system
namespace it does not own, warning on every install.

Note that `kubectl apply -n other -f install.yaml` does NOT relocate it — the
objects carry an explicit metadata.namespace and kubectl refuses the mismatch
rather than honouring the flag. Omitting metadata.namespace would not fix it
either: subjects[].namespace on the ClusterRoleBinding is required, so the
binding would keep naming the rendered namespace while the ServiceAccount
landed elsewhere, granting nothing and failing silently.

Why the classes are not in this file: the controller creates its default
IngressClass and GatewayClass at startup (--install, on by default). One fewer
resource to keep in sync with the code, and no GatewayClass in the manifest to
fail on clusters without the Gateway API CRDs.

Why the manifest lives beside the controller: spec.controller must equal the
controller's Go import path, which is derived by reflection. Nothing checks the
two agree at build time, so a package rename would otherwise invalidate a
manifest sitting in another repo.

Provider override, on the resource or on its class:

    tunnel.pizza/provider: my-own-host.example

Traffic never transits the provider — the controller asks it for a tunnel, then
the cluster connects outbound to the edge. If the provider is unreachable,
existing tunnels keep serving and only new ones are blocked.
*/ -}}
{{- if not .Values.namespace.create }}
{{ include "tunnel.header" . }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tunnel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tunnel.labels" . | nindent 4 }}
