# What ships is a versioned chart, not this path. https://tunnel.pizza reads
# index.yaml from the Helm repository, picks the newest stable release and
# renders that tarball, so moving or renaming this directory breaks a release
# build in this repository's own CI rather than breaking installs from another
# repository's fetch. Do not reintroduce an archive fetch of this path: that
# coupling was real until v0.1.0 and was invisible to both repositories' CI.

apiVersion: v2
name: tunnel
description: Public reachability for a Kubernetes cluster via a tunnel provider.
type: application
version: 0.1.0
appVersion: "latest"
home: https://tunnel.pizza
sources:
  - https://github.com/scaffoldly/tunnel
