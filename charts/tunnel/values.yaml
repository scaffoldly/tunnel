image:
  repository: ghcr.io/scaffoldly/tunnel
  tag: latest
  # Empty renders no imagePullPolicy at all, which is what you want: Kubernetes
  # infers Always for :latest and IfNotPresent for a pinned tag. Set it to
  # override -- the e2e suite uses Never so a missing locally built image fails
  # loudly instead of pulling the published one.
  pullPolicy: ""

# Each is a separate switch because the blast radii differ. The class flags
# create objects only this controller claims; gatewayAPI writes cluster-scoped
# CRDs that every Gateway API implementation in the cluster reads, so a cluster
# running Istio or Cilium should turn it off and own them itself.
install:
  ingressClasses: true
  gatewayClasses: true
  gatewayAPI: true

namespace:
  # Render a Namespace object. Off for `helm install`, which places objects with
  # -n and makes the namespace with --create-namespace; on for `make yaml`, so
  # the manifest served at https://tunnel.pizza is self-contained.
  create: false
