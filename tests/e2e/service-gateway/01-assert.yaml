apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
status:
  readyReplicas: 1
---
# The front half. Nobody applied this: its name is
# <service>-<provider with dots as dashes>, the same rule the Ingress branch
# uses, so switching branch replaces the children rather than leaving a
# differently-named orphan.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-tunnel-pizza
  labels:
    app.kubernetes.io/managed-by: tunnel
  annotations:
    # Detected, not declared: nginx says nothing about its protocol, so the
    # controller dialed it, was refused a TLS handshake, and concluded
    # plaintext. Same detection the Ingress branch gets.
    tunnel.pizza/protocol: http
  ownerReferences:
    - apiVersion: v1
      kind: Service
      name: nginx
      controller: true
spec:
  gatewayClassName: tunnel.pizza
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# The half that does the work. A Gateway names no backend, so without this the
# Gateway has nothing to point a tunnel at and the Gateway half reports it as
# unsupported. Both children or neither.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-tunnel-pizza
  labels:
    app.kubernetes.io/managed-by: tunnel
  ownerReferences:
    - apiVersion: v1
      kind: Service
      name: nginx
      controller: true
spec:
  parentRefs:
    - name: nginx-tunnel-pizza
  rules:
    - backendRefs:
        - name: nginx
          port: 80
---
# The address lands on the Gateway's status.addresses, not on
# status.loadBalancer — the Gateway API's equivalent, and a different field from
# the one the Ingress branch writes. The hostname is minted per run and cannot
# be asserted; that an address of type Hostname exists at all proves a tunnel
# came up.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-tunnel-pizza
status:
  addresses:
    - type: Hostname
