# One annotation on a Service that already existed, and a child Ingress appears
# for it, classed for the provider named in the annotation's prefix.
#
# The namespace is spelled out because this object is not in the namespace
# kuttl generated for this test — the point is that the trigger works on a
# Service the test did not create.
#
# The class is what the assertion is really about: the prefix of
# `tunnel.pizza/tunnel` became `ingressClassName: tunnel.pizza`, which is the
# same vocabulary a hand-written Ingress uses. No new concept, and nothing here
# that the user could not have written themselves.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-tunnel-pizza
  namespace: default
  labels:
    app.kubernetes.io/managed-by: tunnel
    # Nobody wrote this. The controller dialed kubernetes.default.svc:443,
    # completed a TLS handshake, and recorded what it found — this assertion is
    # the only thing standing between working detection and a silently
    # plaintext tunnel that 400s every request.
    tunnel.pizza/protocol: https
  ownerReferences:
    - apiVersion: v1
      kind: Service
      name: kubernetes
      controller: true
spec:
  ingressClassName: tunnel.pizza
  defaultBackend:
    service:
      name: kubernetes
      port:
        number: 443
status:
  # The ports are written only alongside a non-empty hostname, so asserting
  # them makes this step wait until the tunnel is actually up — which the curl
  # in the next step needs, and which the Ingress existing does not imply.
  loadBalancer:
    ingress:
      - ports:
          - port: 80
            protocol: TCP
          - port: 443
            protocol: TCP
