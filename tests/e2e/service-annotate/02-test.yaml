# The claim that makes the annotation path safe to point at a Service somebody
# else owns: the controller writes NOTHING back to it.
#
# This regresses silently. A status write here would be rejected by the API
# server, so that half is enforced for us — but an annotation would succeed,
# and nothing except this script would ever notice. The mirrored
# {provider}/hostname annotation was a real proposal, and it is dead only
# because it was decided against, not because anything prevents it.
#
# Exactly one annotation, the one 01-annotate.yaml added: the kubernetes
# Service ships with none of its own.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      status=$(kubectl get service kubernetes -n default -o jsonpath='{.status.loadBalancer.ingress}')
      test -z "$status" || { echo "status.loadBalancer.ingress on the annotated service = '$status', want empty" >&2; exit 1; }
      count=$(kubectl get service kubernetes -n default -o go-template='{{ len .metadata.annotations }}')
      test "$count" = "1" || { echo "annotations on the annotated service = $count, want only the user's own" >&2; exit 1; }
      kubectl get service kubernetes -n default -o jsonpath='{.metadata.annotations.tunnel\.pizza/tunnel}' | grep -qx true

  # Traffic really does traverse the tunnel and reach the API server — and is
  # then refused by it, which is the part worth knowing.
  #
  # consts.OriginScheme is always http, because an Ingress carries no portable
  # way to declare a TLS origin. The kubernetes Service's only port is 443
  # speaking TLS, so the origin is http://kubernetes.default.svc:443 and the
  # API server's TLS listener answers every request with a plaintext
  # 400 "Client sent an HTTP request to an HTTPS server."
  #
  # So this asserts the 400, not `ok`. That is not a workaround for a broken
  # test: the 400 is proof the bytes went all the way through the tunnel to the
  # API server and came back, which a 502 or 530 from the edge would not be.
  # Getting `ok` here would require the controller to dial TLS origins, which
  # is a change to OriginScheme and a deliberate decision about exposing an API
  # server — not something to smuggle in through a test.
  #
  # The hostname is deliberately not echoed on failure.
  - script: |
      host=$(kubectl get ingress kubernetes-tunnel-pizza -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
      test -n "$host" || { echo "no hostname published on the child ingress" >&2; exit 1; }

      code=$(curl -sS --retry 10 --retry-delay 3 --retry-all-errors \
        -o /tmp/tunnel-healthz.out -w '%{http_code}' "https://$host/healthz")
      test "$code" = "400" || {
        echo "GET /healthz through the tunnel returned $code, want 400 from the API server's TLS listener" >&2
        sed -e 's/^/  body: /' /tmp/tunnel-healthz.out >&2
        exit 1
      }
      grep -q 'Client sent an HTTP request to an HTTPS server' /tmp/tunnel-healthz.out || {
        echo "400 did not come from the API server's TLS listener; the tunnel may not reach it at all" >&2
        sed -e 's/^/  body: /' /tmp/tunnel-healthz.out >&2
        exit 1
      }
