# The claim that makes the annotation path safe to point at a Service somebody
# else owns: the controller writes NOTHING back to it.
#
# This regresses silently. A status write here would be rejected by the API
# server, so that half is enforced for us — but an annotation would succeed,
# and nothing except this script would ever notice. The mirrored
# {provider}/hostname annotation was a real proposal, and it is dead only
# because it was decided against, not because anything prevents it.
#
# Exactly the one annotation 01-annotate.yaml added, and no second: the
# kubernetes Service ships with none of its own, so anything else here was
# written by the controller. In particular the detected protocol goes on the
# child, never back onto the Service.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      status=$(kubectl get service kubernetes -n default -o jsonpath='{.status.loadBalancer.ingress}')
      test -z "$status" || { echo "status.loadBalancer.ingress on the annotated service = '$status', want empty" >&2; exit 1; }
      # The kubernetes Service ships with two labels of its own, and this
      # suite adds one. Anything beyond three was written by the controller.
      count=$(kubectl get service kubernetes -n default -o go-template='{{ len .metadata.labels }}')
      test "$count" = "3" || {
        echo "labels on the service = $count, want its own 2 plus the 1 this suite set" >&2
        kubectl get service kubernetes -n default -o jsonpath='{.metadata.labels}' >&2
        exit 1
      }
      test -z "$(kubectl get service kubernetes -n default -o jsonpath='{.metadata.annotations}')" || {
        echo "the controller wrote annotations onto the service" >&2; exit 1; }
      kubectl get service kubernetes -n default -o jsonpath='{.metadata.labels.tunnel\.pizza/tunnel}' | grep -qx ingress

  # A real 2xx from the API server, fetched over the public internet through a
  # tunnel that was created by annotating a Service.
  #
  # This works because the controller detected that the origin speaks TLS and
  # dialed it that way — nobody told it — and because libtunnel does not verify the origin's
  # certificate, which it cannot: the API server's cert is signed by the cluster
  # CA and no public chain covers it.
  #
  # What is exposed is bounded by RBAC rather than by us: the default
  # system:public-info-viewer role grants system:unauthenticated exactly
  # /healthz, /livez, /readyz and /version. Every other path answers 403 to an
  # anonymous caller, which the second fetch here asserts — a tunnel to an API
  # server that served more than that would be a very different thing to ship.
  #
  # The hostname is deliberately not echoed on failure.
  - script: |
      host=$(kubectl get ingress kubernetes-tunnel-pizza -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
      test -n "$host" || { echo "no hostname published on the child ingress" >&2; exit 1; }

      code=$(curl -sS --retry 10 --retry-delay 3 --retry-all-errors \
        -o /tmp/tunnel-healthz.out -w '%{http_code}' "https://$host/healthz")
      case "$code" in
        2??) ;;
        *)
          echo "GET /healthz through the tunnel returned $code, want 2xx" >&2
          sed -e 's/^/  body: /' /tmp/tunnel-healthz.out >&2
          exit 1
          ;;
      esac
      grep -qx 'ok' /tmp/tunnel-healthz.out || {
        echo "2xx from /healthz did not carry the API server's 'ok'" >&2
        sed -e 's/^/  body: /' /tmp/tunnel-healthz.out >&2
        exit 1
      }

  - script: |
      host=$(kubectl get ingress kubernetes-tunnel-pizza -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
      code=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w '%{http_code}' "https://$host/api/v1/namespaces/kube-system/secrets")
      test "$code" = "403" || { echo "anonymous API access through the tunnel returned $code, want 403" >&2; exit 1; }
