# Fetches the address the Gateway published, the same way the ingress suite
# does. status.addresses[0].value rather than a hostname field: the Gateway API
# models an address as a typed value.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      host=$(kubectl get gateway nginx -n "$NAMESPACE" -o jsonpath='{.status.addresses[0].value}')
      test -n "$host" || { echo "no address published on gateway/nginx" >&2; exit 1; }
      curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "http://$host/" | grep -q 'Welcome to nginx'

  - script: |
      host=$(kubectl get gateway nginx -n "$NAMESPACE" -o jsonpath='{.status.addresses[0].value}')
      test -n "$host" || { echo "no address published on gateway/nginx" >&2; exit 1; }
      curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "https://$host/" | grep -q 'Welcome to nginx'
